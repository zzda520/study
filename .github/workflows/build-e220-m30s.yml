name: Build Meshtastic E220-400M30S LLCC68

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-e220-m30s.yml'
      - 'build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Meshtastic firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: 2a398fb2fdff166a91769fa95e3aa773a007f521
          submodules: recursive

      - name: Patch ProMicro DIY variant for E220-400M30S / LLCC68
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("variants/nrf52840/diy/nrf52_promicro_diy_tcxo/variant.h")
          s = p.read_text()

          old = "#define USE_LLCC68\n#define USE_SX1262\n#define USE_RF95\n#define USE_SX1268\n#define USE_LR1121\n#define USE_LR2021"
          new = "#define USE_LLCC68\n// E220-400M30S custom build: force LLCC68 only\n// #define USE_SX1262\n// #define USE_RF95\n// #define USE_SX1268\n// #define USE_LR1121\n// #define USE_LR2021"
          if old not in s:
              raise SystemExit("Could not find radio-family block")
          s = s.replace(old, new, 1)

          marker = "#define SX126X_TXEN RADIOLIB_NC  // Assuming that DIO2 is connected to TXEN pin. If not, TXEN must be connected.\n"
          inject = marker + "\n// E220-400M30S (LLCC68 + external PA/LNA)\n// Model module PA gain as 8 dB: 22 dBm radio drive -> approx. 30 dBm module output.\n// Meshtastic regional output-power limits are applied before this conversion.\n#define SX126X_MAX_POWER 22\n#undef TX_GAIN_LORA\n#define TX_GAIN_LORA 8\n"
          if marker not in s:
              raise SystemExit("Could not find SX126X_TXEN marker")
          s = s.replace(marker, inject, 1)

          p.write_text(s)
          PY

      - name: Show patched radio section
        run: |
          grep -n -A45 -B8 "LORA MODULES" variants/nrf52840/diy/nrf52_promicro_diy_tcxo/variant.h
          grep -n -A18 -B4 "E220-400M30S" variants/nrf52840/diy/nrf52_promicro_diy_tcxo/variant.h

      - name: Build nRF52840 UF2
        uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: nrf52840
          pio_env: nrf52_promicro_diy_tcxo
          pio_target: build

      - name: Collect output
        shell: bash
        run: |
          mkdir -p custom-release
          cp -av release/* custom-release/ 2>/dev/null || true
          find .pio/build/nrf52_promicro_diy_tcxo -maxdepth 1 -type f \( -name '*.uf2' -o -name '*.hex' -o -name '*.bin' -o -name '*.elf' \) -exec cp -av {} custom-release/ \; || true
          {
            echo "Target: NoLogo ProMicro nRF52840 + Ebyte E220-400M30S (LLCC68)"
            echo "Upstream: meshtastic/firmware develop commit 2a398fb2fdff166a91769fa95e3aa773a007f521"
            echo "Radio driver: LLCC68 only"
            echo "Pinout:"
            echo "  MISO P0.02"
            echo "  MOSI P1.15"
            echo "  SCK P1.11"
            echo "  NSS/CS P1.13"
            echo "  DIO1 P0.10"
            echo "  BUSY P0.29"
            echo "  NRST P0.09"
            echo "  RXEN P0.17"
            echo "  DIO2 must be externally connected to E220 TXEN"
            echo "PA model:"
            echo "  SX126X_MAX_POWER 22"
            echo "  TX_GAIN_LORA 8"
            echo "TCXO:"
            echo "  Stock ProMicro DIY probing behavior retained (1.8V + TCXO_OPTIONAL)"
            echo "IMPORTANT:"
            echo "  LLCC68 does NOT support BW250/SF11 (standard LongFast)."
            echo "  Start with MEDIUM_SLOW (BW250/SF10) or LONG_TURBO (BW500/SF11)."
          } > custom-release/README-E220-400M30S.txt
          ls -lah custom-release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-e220-400m30s-llcc68-nrf52840
          path: custom-release/
          retention-days: 30
